<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jenny's SQL Lab — Game Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 0.75rem 1rem;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1rem;
      margin: 0;
    }
    header span {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    /* Challenge Box */
    #challenge-box {
      background:#1e293b;
      padding:1rem;
      border-bottom:1px solid #334155;
    }
    #challenge-box h2 {
      margin:0 0 .5rem 0;
      font-size:1.1rem;
    }
    #challenge-box p {
      margin:0 0 .5rem 0;
      color:#cbd5e1;
    }
    #check-answer {
      background:#38bdf8;
      border:none;
      padding:.4rem .8rem;
      border-radius:.3rem;
      font-weight:600;
      cursor:pointer;
    }
    #challenge-result {
      margin-left:1rem;
      font-weight:600;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      overflow: hidden;
    }
    #editor-container, #results-container {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1f2937;
    }
    #results-container {
      border-right: none;
      border-left: 1px solid #1f2937;
    }
    #editor {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 0.75rem;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }
    #controls {
      padding: 0.5rem 0.75rem
