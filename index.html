<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jenny's SQL Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 0.75rem 1rem;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1rem;
      margin: 0;
    }
    header span {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      overflow: hidden;
    }
    #editor-container, #results-container {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1f2937;
    }
    #results-container {
      border-right: none;
      border-left: 1px solid #1f2937;
    }
    #editor {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 0.75rem;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }
    #controls {
      padding: 0.5rem 0.75rem;
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #020617;
    }
    button {
      background: #22c55e;
      border: none;
      color: #022c22;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover {
      background: #16a34a;
    }
    #status {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    #results {
      flex: 1;
      overflow: auto;
      padding: 0.75rem;
      background: #020617;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid #1f2937;
      padding: 0.35rem 0.5rem;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #111827;
      font-weight: 600;
    }
    tr:nth-child(even) td {
      background: #020617;
    }
    tr:nth-child(odd) td {
      background: #030712;
    }
    #error {
      color: #f97373;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #results-container {
        border-left: none;
        border-top: 1px solid #1f2937;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Jenny's SQL Lab</h1>
      <span>In-memory SQLite · no backend · safe to break</span>
    </div>
    <span>Type SQL on the left, run, see results on the right.</span>
  </header>

  <main>
    <section id="editor-container">
      <textarea id="editor"></textarea>
      <div id="controls">
        <button id="run">Run (Ctrl+Enter)</button>
        <div id="status">Loading SQL engine…</div>
      </div>
    </section>
    <section id="results-container">
      <div id="results"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
  <script>
    let db = null;

    function renderTable(result) {
      if (!result || !result.columns || !result.values) return "<em>No rows returned.</em>";

      const cols = result.columns;
      const rows = result.values;

      let html = "<table><thead><tr>";
      for (const c of cols) {
        html += "<th>" + c + "</th>";
      }
      html += "</tr></thead><tbody>";

      for (const row of rows) {
        html += "<tr>";
        for (const cell of row) {
          html += "<td>" + (cell === null ? "NULL" : cell) + "</td>";
        }
        html += "</tr>";
      }

      html += "</tbody></table>";
      return html;
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setResults(html, errorMsg = "") {
      document.getElementById("results").innerHTML = html + (errorMsg ? "<div id='error'>" + errorMsg + "</div>" : "");
    }

    async function initDb() {
      setStatus("Loading SQL engine…");
      const SQL = await initSqlJs({
        locateFile: file => "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/" + file
      });
      db = new SQL.Database();

      // Sample dataset: tiny e‑commerce style table
      const schema = `
        CREATE TABLE users (
          id INTEGER PRIMARY KEY,
          name TEXT,
          country TEXT
        );
        INSERT INTO users (name, country) VALUES
          ('Alice', 'US'),
          ('Bob', 'US'),
          ('Carlos', 'MX'),
          ('Diana', 'CA');

        CREATE TABLE orders (
          id INTEGER PRIMARY KEY,
          user_id INTEGER,
          amount REAL,
          created_at TEXT,
          FOREIGN KEY(user_id) REFERENCES users(id)
        );
        INSERT INTO orders (user_id, amount, created_at) VALUES
          (1, 120.50, '2024-01-01'),
          (1, 80.00,  '2024-01-05'),
          (2, 42.25,  '2024-01-03'),
          (3, 300.00, '2024-01-10');
      `;
      db.run(schema);

      const editor = document.getElementById("editor");
      editor.value =
`-- Sample queries to get you started:

-- All users
SELECT * FROM users;

-- Join users and orders
SELECT u.name, o.amount, o.created_at
FROM users u
JOIN orders o ON u.id = o.user_id
ORDER BY o.created_at DESC;

-- Total spend per user
SELECT u.name, SUM(o.amount) AS total_spend
FROM users u
JOIN orders o ON u.id = o.user_id
GROUP BY u.name
ORDER BY total_spend DESC;`;

      setStatus("Ready. Press Run or Ctrl+Enter.");
      setResults("<em>Run a query to see results.</em>");
    }

    function runQuery() {
      if (!db) return;
      const sql = document.getElementById("editor").value.trim();
      if (!sql) {
        setResults("<em>Type a query first.</em>");
        return;
      }
      try {
        const results = db.exec(sql);
        if (!results.length) {
          setResults("<em>Query executed. No rows returned.</em>");
        } else {
          const tables = results.map(r => renderTable(r)).join("<br/>");
          setResults(tables);
        }
        setStatus("Query executed successfully.");
      } catch (e) {
        setResults("", e.message || String(e));
        setStatus("Error running query.");
      }
    }

    document.getElementById("run").addEventListener("click", runQuery);
    document.getElementById("editor").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runQuery();
      }
    });

    initDb();
  </script>
</body>
</html>
